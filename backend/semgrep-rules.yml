rules:
  - id: java-hardcoded-secret
    languages: [java]
    message: Possible hardcoded credential or secret.
    severity: WARNING
    pattern-regex: '(?i)(password|passwd|secret|api[_-]?key)\s*=\s*"[^"\n]+"'
  - id: java-runtime-command
    languages: [java]
    message: Runtime command execution requires security review.
    severity: WARNING
    pattern: Runtime.getRuntime().exec(...)